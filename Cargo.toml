[package]
name = "merkle-tree"
version = "1.0.0"
edition = "2021"
authors = ["HM Sibghat Ullah <h.m.sibghatullah1997@gmail.com>"]
license = "MIT OR Apache-2.0"
rust-version = "1.64"
description = "no_std SHA-256 Merkle tree with inclusion proofs, compact multiproofs, and optional BLAKE3 or Poseidon hashes."
repository = "https://github.com/SibghatUllah1997/zk-merkle-rs"
readme = "README.md"
keywords = ["merkle", "sha256", "proofs", "cryptography", "no-std"]
categories = ["cryptography", "data-structures", "no-std"]

[dependencies]
sha2 = { version = "0.10", default-features = false }
hex = { version = "0.4", default-features = false, features = ["alloc"] }
serde = { version = "1.0", default-features = false, features = ["derive", "alloc"], optional = true }
# blake3 1.8.7's crate manifest uses edition 2024, which Cargo 1.83 cannot parse.
blake3 = { version = "=1.5.5", default-features = false, optional = true }
light-poseidon-nostd = { version = "0.4.1", default-features = false, optional = true }
ark-bn254 = { version = "0.5", default-features = false, features = ["curve"], optional = true }
ark-ff = { version = "0.5", default-features = false, optional = true }
halo2_proofs = { version = "=0.3.5", default-features = false, optional = true }
ff = { version = "0.13", default-features = false, optional = true }
# halo2_proofs asks for blake2b_simd 1, which would otherwise resolve to an
# edition-2024 release. Pin a 2021-edition crate so older Cargo can parse it.
blake2b_simd = { version = "=1.0.2", optional = true }
rand = { version = "0.8", optional = true }
# Pin a 2021-edition wasm-bindgen. Newer 0.2 releases pull edition-2024
# crates that Cargo 1.83 cannot parse.
wasm-bindgen = { version = "=0.2.100", optional = true }
# zeroize 1.9+ and zeroize_derive 1.5 use edition 2024. Pin 2021-edition
# crates so halo2_proofs stays parseable on Cargo 1.83.
zeroize = { version = "=1.8.1", optional = true, default-features = false }
zeroize_derive = { version = "=1.4.2", optional = true }
# enum-ordinalize 4.4 uses edition 2024. Pin 4.3 so Halo 2 deps parse on Cargo 1.83.
enum-ordinalize = { version = "=4.3.2", optional = true, default-features = false }
enum-ordinalize-derive = { version = "=4.3.2", optional = true }

[dev-dependencies]
proptest = { version = "=1.5.0", default-features = false, features = ["std"] }
serde_json = "1.0"

[[bin]]
name = "merkle"
path = "src/bin/merkle.rs"
required-features = ["std"]
doc = false

[[example]]
name = "file_chunking"
required-features = ["std"]
doc = false

[[example]]
name = "append_only_log"
required-features = ["std"]
doc = false

[[example]]
name = "committed_root"
required-features = ["std"]
doc = false

[[test]]
name = "cli_bin"
path = "tests/cli_bin.rs"
required-features = ["std"]

[[test]]
name = "cli_sum"
path = "tests/cli_sum.rs"
required-features = ["std", "merkle_sum"]

[[test]]
name = "wasm_verify"
path = "tests/wasm_verify.rs"
required-features = ["wasm"]

[[test]]
name = "range_circuit"
path = "tests/range_circuit.rs"
required-features = ["zk-range"]

[[test]]
name = "range_frozen"
path = "tests/range_frozen.rs"
required-features = ["zk-range"]

[[bench]]
name = "merkle_build"
harness = false

[features]
default = ["std"]
## Enable the standard library, the `merkle` CLI, and streaming chunking.
std = []
## Serde derives on proof, root, leaf-info, checkpoint, and Merkle-sum types.
serde = ["dep:serde"]
## Circom-compatible Poseidon (BN254, x^5) via light-poseidon-nostd.
poseidon = ["dep:light-poseidon-nostd", "dep:ark-bn254", "dep:ark-ff"]
## Placeholder Rescue hash API. Functions return HashNotImplemented.
rescue = []
## BLAKE3 as an alternative, fully implemented hash (no_std friendly).
blake3 = ["dep:blake3"]
## Merkle sum tree types for proof of reserves (SHA-256, no extra deps).
merkle_sum = []
## 64-bit range-check circuit (`0 <= amount < 2^64`) via halo2_proofs.
zk-range = ["std", "dep:halo2_proofs", "dep:ff", "dep:blake2b_simd", "dep:rand", "dep:zeroize", "dep:zeroize_derive", "dep:enum-ordinalize", "dep:enum-ordinalize-derive"]
## Browser verifier for plain and sum-tree inclusion proofs via wasm-bindgen.
wasm = ["std", "merkle_sum", "dep:wasm-bindgen"]
