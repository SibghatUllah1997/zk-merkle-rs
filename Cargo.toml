[package]
name = "merkle-tree"
version = "0.1.0"
edition = "2021"
authors = ["HM Sibghat Ullah <h.m.sibghatullah1997@gmail.com>"]
license = "MIT"
description = "Educational Rust library implementing a SHA-256 Merkle tree with inclusion proofs."
repository = ""
keywords = ["merkle", "sha256", "proofs", "cryptography"]
categories = ["cryptography", "data-structures"]

[dependencies]
sha2 = { version = "0.10", default-features = false }
hex = { version = "0.4", default-features = false, features = ["alloc"] }
serde = { version = "1.0", default-features = false, features = ["derive", "alloc"], optional = true }

[dev-dependencies]

[[bench]]
name = "merkle_build"
harness = false

[features]
default = ["std"]
std = []
serde = ["dep:serde"]
