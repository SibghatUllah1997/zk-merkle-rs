name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: |
          rustup update stable
          rustup default stable
          rustup component add clippy rustfmt

      - name: Rustfmt
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Tests
        run: cargo test --all-features -- --nocapture

      - name: Docs
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --no-deps --all-features

  features:
    name: features (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: no_std
            flags: --no-default-features
          - name: no_std+serde
            flags: --no-default-features --features serde
          - name: std
            flags: --no-default-features --features std
          - name: std+serde
            flags: --all-features
          - name: no_std+poseidon+rescue
            flags: --no-default-features --features poseidon,rescue
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: |
          rustup update stable
          rustup default stable
          rustup component add clippy

      - name: Clippy
        run: cargo clippy --all-targets ${{ matrix.flags }} -- -D warnings

      - name: Tests
        run: cargo test ${{ matrix.flags }} -- --nocapture
