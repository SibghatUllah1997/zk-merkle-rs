name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: |
          rustup update stable
          rustup default stable
          rustup component add clippy rustfmt

      - name: Rustfmt
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Tests
        run: cargo test --all-features -- --nocapture

      - name: Docs
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --no-deps --all-features

  features:
    name: features (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: no_std
            flags: --no-default-features
          - name: no_std+serde
            flags: --no-default-features --features serde
          - name: std
            flags: --no-default-features --features std
          - name: std+serde
            flags: --all-features
          - name: no_std+poseidon+rescue
            flags: --no-default-features --features poseidon,rescue
          - name: no_std+blake3
            flags: --no-default-features --features blake3
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: |
          rustup update stable
          rustup default stable
          rustup component add clippy

      - name: Clippy
        run: cargo clippy --all-targets ${{ matrix.flags }} -- -D warnings

      - name: Tests
        run: cargo test ${{ matrix.flags }} -- --nocapture

  no_std:
    name: no_std (bare metal)
    runs-on: ubuntu-latest
    env:
      TARGET: thumbv7em-none-eabihf
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: |
          rustup update stable
          rustup default stable
          rustup component add clippy rustfmt
          rustup target add "$TARGET"

      # The target ships no std, so any std use in the crate or its deps fails here.
      - name: Build library for bare metal
        run: |
          cargo build --lib --target "$TARGET" --no-default-features
          cargo build --lib --target "$TARGET" --no-default-features --features serde
          cargo build --lib --target "$TARGET" --no-default-features --features blake3
          cargo build --lib --target "$TARGET" --no-default-features --features serde,blake3,poseidon,rescue

      - name: Smoke crate format
        working-directory: ci/no-std-smoke
        run: cargo fmt -- --check

      - name: Smoke crate clippy (bare metal)
        working-directory: ci/no-std-smoke
        run: |
          cargo clippy --target "$TARGET" -- -D warnings
          cargo clippy --target "$TARGET" --features serde,blake3 -- -D warnings

      - name: Smoke crate build (bare metal)
        working-directory: ci/no-std-smoke
        run: |
          cargo build --target "$TARGET"
          cargo build --target "$TARGET" --features serde,blake3

      - name: Smoke crate tests (host)
        working-directory: ci/no-std-smoke
        run: |
          cargo test
          cargo test --features serde,blake3
